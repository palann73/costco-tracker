# A Postgres database, plus a throwaway container for running the tool.
#
#   docker compose up -d db                                           # start the database
#   docker compose run --rm importer migrate                          # create or upgrade tables
#   docker compose run --rm importer import receipts/2026-11-17.txt   # import a receipt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data          # on TrueNAS, point this at a dataset
    ports:
      - "5432:5432"                                # so Grafana or a SQL tool can connect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s

  importer:
    image: python:3.12-slim
    profiles: ["tools"]                            # only runs when you ask for it
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: ["sh", "-c", "pip install -q -r requirements.txt && python -m costco_tracker.cli \"$$@\"", "--"]
    depends_on:
      db:
        condition: service_healthy
